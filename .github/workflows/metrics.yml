name: GitHub Metrics

permissions:
  contents: write

on:
  # Run twice daily — 1 AM & 1 PM UTC — so metrics stay fresh
  schedule:
    - cron: "0 1,13 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
  # Refresh immediately on any push to main
  push:
    branches:
      - main

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1 — General Stats + Languages + ISO Calendar
  # Output: metrics.general.svg  →  committed to main
  # ─────────────────────────────────────────────────────────────────────────────
  general-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate General Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Anish-Pokharel7
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kathmandu
          filename: metrics.general.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update general metrics [skip ci]"

          # ISO Contribution Calendar (full year) — Tracks daily commits
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Top Languages
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, awk, cmake,
            gnuplot
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

          # Starred Repos Snapshot
          plugin_stars: yes
          plugin_stars_limit: 4

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Habits & Recent Activity
  # Tracks daily commit habits, coding patterns, and recent public events.
  # Output: metrics.habits.svg  →  committed to main
  # ─────────────────────────────────────────────────────────────────────────────
  coding-habits:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Coding Habits Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Anish-Pokharel7
          template: classic
          base: ""
          config_timezone: Asia/Kathmandu
          filename: metrics.habits.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update habits metrics [skip ci]"

          # Coding Habit Analysis — daily commit frequency, active days & hours
          plugin_habits: yes
          plugin_habits_from: 200        # Analyse last 200 events
          plugin_habits_days: 14         # Over last 14 days
          plugin_habits_facts: yes       # Show fun habit facts
          plugin_habits_charts: yes      # Bar charts for hours/days
          plugin_habits_trim: yes        # Remove empty trailing hours

          # Recent Public Activity Feed (last 10 events: commits, PRs, issues)
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 14
          plugin_activity_filter: >-
            push, pr, issue, release, review, comment
          plugin_activity_visibility: public

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Achievements (auto-tracks milestones from your GitHub history)
  # Milestones: first commit, PRs merged, stars earned, etc.
  # Output: metrics.achievements.svg  →  committed to main
  # ─────────────────────────────────────────────────────────────────────────────
  achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Achievements Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Anish-Pokharel7
          template: classic
          base: ""
          config_timezone: Asia/Kathmandu
          filename: metrics.achievements.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update achievements metrics [skip ci]"

          # Auto-detect and display earned achievement badges
          plugin_achievements: yes
          plugin_achievements_threshold: B      # Show B-rank and above
          plugin_achievements_secrets: yes       # Include secret achievements
          plugin_achievements_display: detailed  # Show progress bars
          plugin_achievements_limit: 0           # 0 = show all earned

