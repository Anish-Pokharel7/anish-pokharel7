name: GitHub Metrics

permissions:
  contents: write

on:
  # Run daily at 1 AM UTC
  schedule:
    - cron: "0 1 * * *"
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main so stats refresh immediately
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── General Stats Card ───────────────────────────────────────────────
      - name: Generate General Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Anish-Pokharel7
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kathmandu
          filename: metrics.general.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update metrics [skip ci]"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, awk, cmake,
            gnuplot
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_stars: yes
          plugin_stars_limit: 4

      # ── Streak / Commit Activity Card ────────────────────────────────────
      - name: Generate Commit Streak
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Anish-Pokharel7
          template: classic
          base: ""
          config_timezone: Asia/Kathmandu
          filename: metrics.streak.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update streak metrics [skip ci]"
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_wakatime: no
