name: GitHub Snake Game

permissions:
  contents: write

on:
  # Run daily at midnight UTC so snake updates every day
  schedule:
    - cron: "0 0 * * *"
  # Allow manual triggering
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so contribution graph is accurate
          fetch-depth: 0

      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          # Must match your GitHub username exactly (case-sensitive)
          github_user_name: Anish-Pokharel7
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: update snake animation [skip ci]"
